[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "sczx-business"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "SQLAlchemy>=2.0,<3",
  "PyMySQL>=1.1,<2",
  "alembic>=1.13,<2",
  "python-multipart>=0.0.9,<1",
  "python-dotenv>=1.0,<2",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["sczx_business*"]
