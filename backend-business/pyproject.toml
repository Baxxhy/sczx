[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "sczx-business"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "SQLAlchemy>=2.0,<3",
  "PyMySQL>=1.1,<2",
  "alembic>=1.13,<2",
  "python-multipart>=0.0.9,<1",
  "python-dotenv>=1.0,<2",
  "httpx>=0.27,<1",
  "sympy>=1.13,<2",
  "PyMuPDF>=1.26,<2",
  "python-docx>=1.2,<2",
  "langgraph>=1.2.20,<2",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["sczx_business*"]

[tool.setuptools.package-data]
sczx_business = ["prompts/*.json", "prompts/*.md", "resources/*.json", "resources/*.md"]
