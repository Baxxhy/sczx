name: Basic checks
on: [push, pull_request, workflow_dispatch]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -e backend-business
      - run: PYTHONPATH=backend-business python -m unittest discover -s backend-business/tests -v
      - run: python -m compileall -q backend-business/sczx_business
      - run: PYTHONPATH=backend-business python -c "import sczx_business.main"
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend run test:unit
      - run: npm --prefix frontend run build
      - run: git diff --check HEAD~1 HEAD
