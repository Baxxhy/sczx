name: Basic checks
on: [push, pull_request, workflow_dispatch]
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      SCZX_STORAGE_DIR: /tmp/sczx-${{ github.run_id }}-basic-uploads
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -e backend-business
      - run: PYTHONPATH=backend-business python -m unittest discover -s backend-business/tests -v
      - run: python -m compileall -q backend-business/sczx_business
      - run: python -m py_compile scripts/local.py
      - run: bash -n start-local.sh stop-local.sh install-local.sh
      - run: PYTHONPATH=backend-business python -c "import sczx_business.main"
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend run test:unit
      - run: npm --prefix frontend run build
      - run: git diff --check HEAD~1 HEAD
  mysql-integration:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: sczx_test_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      SCZX_DATABASE_URL: mysql+pymysql://root@127.0.0.1:3306/sczx_test_ci
      SCZX_RUN_MYSQL_TESTS: "1"
      PYTHONPATH: backend-business
      SCZX_STORAGE_DIR: /tmp/sczx-${{ github.run_id }}-mysql-uploads
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e backend-business
      - run: python -m unittest discover -s backend-business/tests -v
